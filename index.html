<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#6366F1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0F0F12"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Momentum - 心理学驱动的专注力应用，帮助您建立高效的工作习惯，通过任务链和专注模式提升生产力。"
    />
    <title>Momentum - 心理学驱动的专注力应用</title>

    <script>
      (() => {
        const root = document.documentElement;

        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = prefersDark;
        try {
          const storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark') isDark = true;
          else if (storedTheme === 'light') isDark = false;
        } catch {
          // Ignore storage access errors and fallback to system preference.
        }

        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
