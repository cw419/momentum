<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#6366F1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0F0F12"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Momentum - 心理学驱动的专注力应用，帮助您建立高效的工作习惯，通过任务链和专注模式提升生产力。"
    />
    <title>Momentum - 心理学驱动的专注力应用</title>

    <!-- 移动端性能优化：100%使用系统字体，节省556KB字体下载，显著提升FCP/LCP -->
    <style>
      :root {
        --safe-area-top: env(safe-area-inset-top);
        --safe-area-bottom: env(safe-area-inset-bottom);
        --safe-area-left: env(safe-area-inset-left);
        --safe-area-right: env(safe-area-inset-right);
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-chinese:
          'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          'WenQuanYi Micro Hei', system-ui, sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-chinese {
        font-family: var(--font-chinese);
      }
      .font-mono {
        font-family: var(--font-mono);
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-chinese);
        font-weight: 700;
      }
      #root {
        min-height: 100vh;
      }
      .gradient-primary {
        background: linear-gradient(
          135deg,
          #6366f1 0%,
          #8b5cf6 50%,
          #a855f7 100%
        );
      }
      .gradient-dark {
        background: linear-gradient(
          135deg,
          #0b1220 0%,
          #111827 56%,
          #0b1220 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .dark .gradient-dark {
        background: linear-gradient(
          135deg,
          rgba(71, 85, 105, 0.88) 0%,
          rgba(51, 65, 85, 0.82) 56%,
          rgba(71, 85, 105, 0.88) 100%
        );
        border-color: rgba(148, 163, 184, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;

        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = prefersDark;
        try {
          const storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'dark') isDark = true;
          else if (storedTheme === 'light') isDark = false;
        } catch {
          // Ignore storage access errors and fallback to system preference.
        }

        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
