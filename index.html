<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Momentum - 心理学驱动的专注力应用，帮助您建立高效的工作习惯，通过任务链和专注模式提升生产力。" />
    <title>Momentum - 心理学驱动的专注力应用</title>

    <!-- 关键 CSS - 内联以避免 FOUC，使用系统字体作为fallback -->
    <style>
      :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --font-chinese: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
      }
      .font-chinese { font-family: var(--font-chinese); }
      .font-mono { font-family: var(--font-mono); }
      h1, h2, h3 { font-family: var(--font-chinese); }
    </style>

    <!-- 预连接字体服务 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 字体加载优化：减少权重数量，使用display=swap确保文本立即可见 -->
    <!-- Inter: 仅加载400和600（覆盖normal和bold需求） -->
    <!-- JetBrains Mono: 仅加载400 -->
    <!-- Noto Sans SC: 仅加载400和700，并使用display=swap让系统字体先显示 -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&family=Noto+Sans+SC:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 延迟加载非关键第三方脚本 -->
    <script>
      // 延迟加载 anime.js (已内化到 npm 包，此处作为备用)
      // 注意: anime.js 现在通过 npm 包导入，此 CDN 脚本已移除
    </script>
  </body>
</html>
