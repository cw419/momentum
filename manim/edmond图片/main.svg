<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 霓虹灯发光滤镜 -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- 字体样式定义 -->
    <style>
      .math-it { font-family: "Times New Roman", serif; font-style: italic; }
      .math-rm { font-family: "Times New Roman", serif; font-style: normal; }
      .title-font { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-weight: bold; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="white" />

  <!-- 左侧面板：去学习 -->
  <g transform="translate(40, 65)">
    <text x="175" y="-25" text-anchor="middle" font-size="28" class="title-font">去学习</text>
    <rect width="350" height="420" fill="none" stroke="#FF4D4D" stroke-width="3" filter="url(#glow-red)" rx="4" />
    
    <!-- 坐标轴 -->
    <line x1="60" y1="400" x2="60" y2="40" stroke="#333" stroke-width="1.2" />
    <path d="M 57 45 L 60 33 L 63 45 Z" fill="#333" />
    <line x1="40" y1="240" x2="330" y2="240" stroke="#333" stroke-width="1.2" />
    <path d="M 325 237 L 337 240 L 325 243 Z" fill="#333" />
    
    <!-- y轴顶部标识 (已上移) -->
    <text x="15" y="25" font-size="16">
        <tspan fill="#1060a0" class="math-it">W(τ)</tspan><tspan class="math-rm">,</tspan><tspan fill="#c00000" class="math-it">V(τ)</tspan>
    </text>
    <text x="342" y="240" font-size="18" class="math-it">τ</text>

    <!-- 填充区域 -->
    <path d="M 60 375 C 68 310 80 260 92 240 L 60 240 Z" fill="#ffb3b3" opacity="0.6" />
    <path d="M 92 240 C 110 210 130 170 180 175 C 240 180 300 220 325 235 L 325 240 L 92 240 Z" fill="#b3dfb3" opacity="0.7" />

    <!-- 曲线 W(τ) -->
    <path d="M 65 85 C 75 185 130 225 325 232" fill="none" stroke="#1060a0" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="95" y="115" fill="#1060a0" font-size="30" class="math-it">W(τ)</text>

    <!-- 曲线 V(τ) -->
    <path d="M 60 375 C 68 310 80 260 92 240 C 110 210 130 170 180 175 C 240 180 300 220 325 235" fill="none" stroke="#c00000" stroke-width="2.5" />
    <text x="145" y="170" fill="#c00000" font-size="30" class="math-it">V(τ)</text>

    <!-- 红色叉号 -->
    <path d="M 235 90 L 315 170 M 315 90 L 235 170" stroke="red" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- 右侧面板：玩手机 -->
  <g transform="translate(410, 65)">
    <text x="175" y="-25" text-anchor="middle" font-size="28" class="title-font">玩手机</text>
    <rect width="350" height="420" fill="none" stroke="#4DFF4D" stroke-width="3" filter="url(#glow-green)" rx="4" />
    
    <!-- 坐标轴 -->
    <line x1="60" y1="400" x2="60" y2="40" stroke="#333" stroke-width="1.2" />
    <path d="M 57 45 L 60 33 L 63 45 Z" fill="#333" />
    <line x1="40" y1="240" x2="330" y2="240" stroke="#333" stroke-width="1.2" />
    <path d="M 325 237 L 337 240 L 325 243 Z" fill="#333" />
    
    <!-- y轴顶部标识 (已上移) -->
    <text x="15" y="25" font-size="16">
        <tspan fill="#1060a0" class="math-it">W(τ)</tspan><tspan class="math-rm">,</tspan><tspan fill="#c00000" class="math-it">V(τ)</tspan>
    </text>
    <text x="342" y="240" font-size="18" class="math-it">τ</text>

    <!-- 填充区域 -->
    <path d="M 60 95 C 70 185 85 220 95 240 L 60 240 Z" fill="#b3dfb3" opacity="0.7" />
    <path d="M 95 240 C 110 270 150 330 220 310 C 275 295 305 260 325 246 L 325 240 L 95 240 Z" fill="#ffb3b3" opacity="0.6" />

    <!-- 曲线 W(τ) -->
    <path d="M 65 85 C 75 185 130 225 325 232" fill="none" stroke="#1060a0" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="105" y="120" fill="#1060a0" font-size="30" class="math-it">W(τ)</text>

    <!-- 曲线 V(τ) -->
    <path d="M 60 95 C 70 185 85 220 95 240 C 110 270 150 330 220 310 C 275 295 305 260 325 246" fill="none" stroke="#c00000" stroke-width="2.5" />
    <text x="175" y="355" fill="#c00000" font-size="30" class="math-it">V(τ)</text>

    <!-- 绿色对勾 -->
    <path d="M 230 150 L 265 190 L 330 100" fill="none" stroke="#28a745" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 底部公式区域 -->
  <g transform="translate(150, 525)">
    <rect width="500" height="70" fill="white" stroke="#333" stroke-width="1" />
    <text x="250" y="46" text-anchor="middle" font-size="32" class="math-rm">
      <tspan class="math-it" font-size="34">I</tspan> = 
      <tspan font-size="46" dy="6">∫</tspan>
      <tspan font-size="16" dx="-10" dy="-26">+∞</tspan>
      <tspan font-size="16" dx="-22" dy="28">0</tspan>
      <tspan dx="10" dy="-10" fill="#1060a0" class="math-it">W(τ)</tspan>
      <tspan class="math-rm"> · </tspan>
      <tspan fill="#c00000" class="math-it">V(τ)</tspan>
      <tspan class="math-rm" dx="6">d</tspan><tspan class="math-it">τ</tspan>
    </text>
  </g>
</svg>