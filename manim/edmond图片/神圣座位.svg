<svg width="850" height="550" viewBox="0 0 850 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 霓虹灯发光滤镜 -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .math-it { font-family: "Times New Roman", serif; font-style: italic; }
      .math-rm { font-family: "Times New Roman", serif; font-style: normal; }
      .title-font { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-weight: bold; }
    </style>
  </defs>

  <rect width="850" height="550" fill="white" />

  <!-- ======================== 左侧面板 ======================== -->
  <g transform="translate(40, 65)">
    <text x="175" y="-25" text-anchor="middle" font-size="26" class="title-font">放弃专注（正常情况）</text>
    <rect width="350" height="420" fill="none" stroke="#FF4D4D" stroke-width="3" filter="url(#glow-red)" rx="4" />
    
    <!-- 坐标轴 -->
    <line x1="60" y1="400" x2="60" y2="40" stroke="#333" stroke-width="1.2" />
    <path d="M 57 45 L 60 33 L 63 45 Z" fill="#333" />
    <line x1="40" y1="240" x2="330" y2="240" stroke="#333" stroke-width="1.2" />
    <path d="M 325 237 L 337 240 L 325 243 Z" fill="#333" />
    
    <text x="15" y="25" font-size="16">
        <tspan fill="#1060a0" class="math-it">W(τ)</tspan><tspan class="math-rm">,</tspan><tspan fill="#c00000" class="math-it">V(τ)</tspan>
    </text>
    <text x="342" y="240" font-size="18" class="math-it">τ</text>

    <!-- 填充区域 -->
    <path d="M 60 95 C 70 185 85 220 95 240 L 60 240 Z" fill="#b3dfb3" opacity="0.7" />
    <path d="M 95 240 C 110 270 150 330 220 310 C 275 295 305 260 325 246 L 325 240 L 95 240 Z" fill="#ffb3b3" opacity="0.6" />

    <!-- 曲线 W(τ) -->
    <path d="M 65 85 C 75 185 130 225 325 232" fill="none" stroke="#1060a0" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="105" y="120" fill="#1060a0" font-size="30" class="math-it">W(τ)</text>

    <!-- 曲线 V(τ) -->
    <path d="M 60 95 C 70 185 85 220 95 240 C 110 270 150 330 220 310 C 275 295 305 260 325 246" fill="none" stroke="#c00000" stroke-width="2.5" />
    <text x="175" y="355" fill="#c00000" font-size="30" class="math-it">V(τ)</text>
  </g>

  <!-- 中间连接箭头 -->
  <g transform="translate(415, 275)">
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#333" stroke-width="3" />
    <path d="M 10 -7 L 25 0 L 10 7 Z" fill="#333" />
  </g>

  <!-- ======================== 右侧面板 ======================== -->
  <g transform="translate(460, 65)">
    <text x="175" y="-25" text-anchor="middle" font-size="26" class="title-font">放弃专注（神圣座位）</text>
    
    <rect width="350" height="420" fill="none" stroke="#FF4D4D" stroke-width="3" filter="url(#glow-red)" rx="4" />
    
    <!-- 坐标轴 -->
    <line x1="60" y1="400" x2="60" y2="40" stroke="#333" stroke-width="1.2" />
    <path d="M 57 45 L 60 33 L 63 45 Z" fill="#333" />
    <line x1="40" y1="240" x2="330" y2="240" stroke="#333" stroke-width="1.2" />
    <path d="M 325 237 L 337 240 L 325 243 Z" fill="#333" />
    
    <text x="15" y="25" font-size="16">
        <tspan fill="#1060a0" class="math-it">W(τ)</tspan><tspan class="math-rm">,</tspan><tspan fill="#c00000" class="math-it">V(τ)</tspan>
    </text>
    <text x="342" y="240" font-size="18" class="math-it">τ</text>

    <!-- 填充区域 -->
    <path d="M 60 160 L 62 240 L 60 240 Z" fill="#b3dfb3" opacity="0.6" />
    <path d="M 62 240 C 65 300 70 410 85 410 C 110 410 130 250 325 242 L 325 240 Z" fill="#ffb3b3" opacity="0.8" />

    <!-- 修改点：统一 W(τ) 的字体大小 -->
    <path d="M 65 110 C 66 230 100 239 325 239.5" fill="none" stroke="#1060a0" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="100" y="115" fill="#1060a0" font-size="30" class="math-it">W(τ)</text>

    <!-- 修改点：将 V(τ) 修改为 V'(τ)，并统一字体大小和样式 -->
    <path d="M 60 120 L 62 240 C 65 300 70 410 85 410 C 110 410 130 250 325 242" fill="none" stroke="#c00000" stroke-width="2.5" />
    <text x="155" y="340" fill="#c00000" font-size="30" class="math-it">
      V<tspan font-style="normal">'</tspan>(τ)
    </text>

    <!-- 红色大箭头 -->
    <path d="M 310 215 L 210 215 L 210 200 L 180 225 L 210 250 L 210 235 L 310 235 Z" fill="#c00000" />
  </g>
</svg>