name: Tauri Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: windows-latest
            target: windows
          - platform: macos-latest
            target: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Supabase secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx tauri build

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== Bundle directory ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle dir found"

      - name: Upload artifacts (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

      - name: Upload artifacts (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.tar.gz.sig

      - name: Upload artifacts (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Supabase secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build Android APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx tauri android build

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          TARGET_APK="$APK_DIR/Momentum_${VERSION}_universal.apk"
          SOURCE_APK=""

          if [ -f "$APK_DIR/app-universal-release.apk" ]; then
            SOURCE_APK="$APK_DIR/app-universal-release.apk"
          elif [ -f "$APK_DIR/app-universal-release-unsigned.apk" ]; then
            SOURCE_APK="$APK_DIR/app-universal-release-unsigned.apk"
          fi

          if [ -n "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
          fi

          echo "=== Android APK ==="
          ls -la "$APK_DIR/" 2>/dev/null || echo "APK dir not found"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/Momentum_*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

  create-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts"

      - name: Generate latest.json for updater
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find artifacts -name "$pattern" -type f | head -n1)
            if [ -n "$sig_file" ]; then cat "$sig_file"; else echo ""; fi
          }

          WIN_SIG=$(read_sig "*.nsis.zip.sig")
          LINUX_SIG=$(read_sig "*.AppImage.tar.gz.sig")
          MAC_SIG=$(read_sig "*.app.tar.gz.sig")

          WIN_URL="$REPO/$(find artifacts -name '*.nsis.zip' ! -name '*.sig' -type f -printf '%f' | head -n1)"
          LINUX_URL="$REPO/$(find artifacts -name '*.AppImage.tar.gz' ! -name '*.sig' -type f -printf '%f' | head -n1)"
          MAC_URL="$REPO/$(find artifacts -name '*.app.tar.gz' ! -name '*.sig' -type f -printf '%f' | head -n1)"

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "Momentum ${{ github.ref_name }}",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": { "signature": "$WIN_SIG", "url": "$WIN_URL" },
              "linux-x86_64": { "signature": "$LINUX_SIG", "url": "$LINUX_URL" },
              "darwin-aarch64": { "signature": "$MAC_SIG", "url": "$MAC_URL" }
            }
          }
          ENDJSON

          echo "=== latest.json ==="
          cat artifacts/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: 'Momentum ${{ github.ref_name }}'
          body: |
            ## Download

            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | `Momentum_*_x64-setup.exe` | Recommended for most users |
            | **Windows** | `Momentum_*_x64_en-US.msi` | For IT/enterprise deployment |
            | **macOS** | `Momentum_*_aarch64.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | **Linux** | `Momentum_*_amd64.AppImage` | Universal, no install needed |
            | **Linux** | `Momentum_*_amd64.deb` | Debian/Ubuntu |
            | **Android** | `Momentum_*_universal.apk` | Sideload install (enable "Unknown sources") |
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
