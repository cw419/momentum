name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Type Coverage
        run: npm run quality:type-coverage

      - name: Test Quality Lint
        run: npm run quality:test:lint

      - name: Test Assertion Guard
        run: npm run quality:test:assertions

      - name: Test (Coverage)
        run: npm run test:coverage

      - name: Test Coverage Hotspots
        run: npm run quality:test:coverage-hotspots

      - name: Test Runtime Budget
        run: npm run quality:test:runtime

      - name: Quality (Soft) - Circular Deps (madge)
        continue-on-error: true
        run: npm run quality:circular:report

      - name: Quality (Soft) - SonarJS Smells (eslint)
        continue-on-error: true
        run: npm run quality:sonar:report

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/quality
          if-no-files-found: ignore

      - name: Build
        run: npm run build
