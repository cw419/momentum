name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Required Quality Lane
        run: npm run quality:ci:required

  info:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user semgrep sqlfluff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Informational Quality Lane
        run: npm run quality:ci:info

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/quality
            reports/jscpd
            reports/mutation
          if-no-files-found: ignore
